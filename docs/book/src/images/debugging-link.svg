<svg xmlns="http://www.w3.org/2000/svg" class="diagram" width="700" height="360" viewBox="0 0 700 360" font-family="Helvetica, Arial, sans-serif" font-size="13">
	<defs>
		<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
		</marker>
	</defs>
	<rect x="0" y="0" width="700" height="360" fill="#ffffff"/>

	<!-- host side -->
	<rect x="10" y="10" width="230" height="340" rx="8" fill="#f1f5fb" stroke="#9fb3cc"/>
	<text x="125" y="32" text-anchor="middle" font-weight="bold">Your PC</text>

	<rect x="35" y="50" width="180" height="44" rx="6" fill="#ffffff" stroke="#5b7aa6"/>
	<text x="125" y="77" text-anchor="middle">VS Code</text>

	<line x1="125" y1="94" x2="125" y2="134" stroke="#444444" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
	<text x="133" y="112" font-size="11" fill="#333333">Debug Adapter</text>
	<text x="133" y="126" font-size="11" fill="#333333">Protocol (stdio)</text>

	<rect x="35" y="136" width="180" height="62" rx="6" fill="#ffffff" stroke="#5b7aa6"/>
	<text x="125" y="160" text-anchor="middle" font-weight="bold">wrench dap</text>
	<text x="125" y="182" text-anchor="middle" font-size="12" fill="#333333">WrenchDebugClient</text>

	<rect x="35" y="236" width="180" height="62" rx="6" fill="#ffffff" stroke="#5b7aa6"/>
	<text x="125" y="260" text-anchor="middle" font-weight="bold">wrench dbg</text>
	<text x="125" y="282" text-anchor="middle" font-size="12" fill="#333333">WrenchDebugClient</text>
	<text x="125" y="325" text-anchor="middle" font-size="11" fill="#333333">one client at a time per target</text>

	<!-- the link -->
	<text x="318" y="84" text-anchor="middle" font-weight="bold">wrench debug protocol</text>
	<text x="318" y="102" text-anchor="middle" font-size="11" fill="#333333">TCP, serial (UART, USB CDC),</text>
	<text x="318" y="116" text-anchor="middle" font-size="11" fill="#333333">or a pipe to the local VM</text>

	<!-- target side -->
	<rect x="400" y="10" width="290" height="340" rx="8" fill="#f4f8f1" stroke="#a3bf94"/>
	<text x="545" y="32" text-anchor="middle" font-weight="bold">Target</text>
	<text x="545" y="48" text-anchor="middle" font-size="11" fill="#333333">a device, wrench dbgserver, or the local VM</text>

	<rect x="415" y="62" width="260" height="40" rx="6" fill="#ffffff" stroke="#6e9a59"/>
	<text x="545" y="80" text-anchor="middle">firmware: attach(), tick(),</text>
	<text x="545" y="95" text-anchor="middle">takeUpload(), wr_executeContext()</text>

	<rect x="415" y="122" width="120" height="40" rx="6" fill="#ffffff" stroke="#6e9a59"/>
	<text x="475" y="139" text-anchor="middle" font-size="12">WrenchDebug-</text>
	<text x="475" y="154" text-anchor="middle" font-size="12">Transport</text>

	<rect x="415" y="186" width="260" height="44" rx="6" fill="#ffffff" stroke="#6e9a59"/>
	<text x="545" y="213" text-anchor="middle" font-weight="bold">WrenchDebugServer</text>

	<line x1="475" y1="162" x2="475" y2="184" stroke="#444444" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
	<line x1="610" y1="102" x2="610" y2="184" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

	<rect x="415" y="252" width="260" height="40" rx="6" fill="#ffffff" stroke="#6e9a59"/>
	<text x="545" y="269" text-anchor="middle" font-size="12">VM hooks: line markers, runtime errors,</text>
	<text x="545" y="284" text-anchor="middle" font-size="12">imports, end of the global code</text>
	<line x1="545" y1="252" x2="545" y2="232" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)"/>

	<rect x="415" y="304" width="80" height="34" rx="6" fill="#ffffff" stroke="#6e9a59"/>
	<text x="455" y="326" text-anchor="middle" font-size="12">program 0</text>
	<rect x="505" y="304" width="80" height="34" rx="6" fill="#ffffff" stroke="#6e9a59"/>
	<text x="545" y="326" text-anchor="middle" font-size="12">program 1</text>
	<rect x="595" y="304" width="80" height="34" rx="6" fill="#ffffff" stroke="#6e9a59" stroke-dasharray="4 3"/>
	<text x="635" y="326" text-anchor="middle" font-size="12">module</text>
	<line x1="545" y1="304" x2="545" y2="294" stroke="#444444" stroke-width="1.5"/>
	<!-- the link, drawn last so its arrowheads stay on top -->
	<line x1="215" y1="167" x2="415" y2="138" stroke="#444444" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
	<line x1="215" y1="267" x2="415" y2="150" stroke="#444444" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
</svg>
