<svg xmlns="http://www.w3.org/2000/svg" class="diagram" width="700" height="640" viewBox="0 0 700 640" font-family="Helvetica, Arial, sans-serif" font-size="12">
	<defs>
		<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M 0 0 L 10 5 L 0 10 z" fill="#444444"/>
		</marker>
	</defs>
	<rect x="0" y="0" width="700" height="640" fill="#ffffff"/>

	<!-- participants -->
	<rect x="30" y="10" width="110" height="34" rx="6" fill="#f1f5fb" stroke="#5b7aa6"/>
	<text x="85" y="32" text-anchor="middle" font-weight="bold">VS Code</text>
	<rect x="190" y="10" width="110" height="34" rx="6" fill="#f1f5fb" stroke="#5b7aa6"/>
	<text x="245" y="32" text-anchor="middle" font-weight="bold">wrench dap</text>
	<rect x="370" y="10" width="150" height="34" rx="6" fill="#f4f8f1" stroke="#6e9a59"/>
	<text x="445" y="32" text-anchor="middle" font-weight="bold">WrenchDebugServer</text>
	<rect x="560" y="10" width="120" height="34" rx="6" fill="#f4f8f1" stroke="#6e9a59"/>
	<text x="620" y="32" text-anchor="middle" font-weight="bold">firmware loop</text>

	<!-- lifelines -->
	<line x1="85" y1="44" x2="85" y2="630" stroke="#9a9a9a" stroke-dasharray="4 4"/>
	<line x1="245" y1="44" x2="245" y2="630" stroke="#9a9a9a" stroke-dasharray="4 4"/>
	<line x1="445" y1="44" x2="445" y2="630" stroke="#9a9a9a" stroke-dasharray="4 4"/>
	<line x1="620" y1="44" x2="620" y2="630" stroke="#9a9a9a" stroke-dasharray="4 4"/>

	<!-- launch request -->
	<line x1="85" y1="70" x2="243" y2="70" stroke="#444444" stroke-width="1.4" marker-end="url(#arrow)"/>
	<text x="165" y="64" text-anchor="middle">launch</text>

	<!-- hello -->
	<line x1="245" y1="96" x2="443" y2="96" stroke="#444444" stroke-width="1.4" marker-end="url(#arrow)"/>
	<text x="345" y="90" text-anchor="middle">Hello, GetInfo</text>
	<line x1="445" y1="114" x2="247" y2="114" stroke="#444444" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
	<text x="345" y="128" text-anchor="middle" font-size="11" fill="#333333">capabilities, state, program 0</text>

	<!-- upload -->
	<line x1="245" y1="156" x2="443" y2="156" stroke="#444444" stroke-width="1.4" marker-end="url(#arrow)"/>
	<text x="345" y="150" text-anchor="middle">LoadBegin, LoadData ..., LoadEnd</text>
	<line x1="445" y1="174" x2="247" y2="174" stroke="#444444" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
	<text x="345" y="188" text-anchor="middle" font-size="11" fill="#333333">program hash</text>
	<rect x="455" y="148" width="150" height="34" rx="4" fill="#fff8e1" stroke="#d8b65a"/>
	<text x="530" y="162" text-anchor="middle" font-size="11">stops debugging program 0,</text>
	<text x="530" y="176" text-anchor="middle" font-size="11">keeps the bytes</text>

	<line x1="245" y1="212" x2="87" y2="212" stroke="#444444" stroke-width="1.4" marker-end="url(#arrow)"/>
	<text x="165" y="206" text-anchor="middle">initialized</text>

	<line x1="85" y1="240" x2="243" y2="240" stroke="#444444" stroke-width="1.4" marker-end="url(#arrow)"/>
	<text x="165" y="234" text-anchor="middle">setBreakpoints,</text>
	<text x="165" y="254" text-anchor="middle">configurationDone</text>

	<line x1="245" y1="276" x2="443" y2="276" stroke="#444444" stroke-width="1.4" marker-end="url(#arrow)"/>
	<text x="345" y="270" text-anchor="middle">SetBreakpoints, Launch</text>
	<line x1="445" y1="292" x2="247" y2="292" stroke="#444444" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
	<text x="345" y="306" text-anchor="middle" font-size="11" fill="#333333">ok, right away</text>

	<!-- tick -->
	<line x1="620" y1="330" x2="447" y2="330" stroke="#444444" stroke-width="1.4" marker-end="url(#arrow)"/>
	<text x="535" y="324" text-anchor="middle">tick()</text>
	<line x1="445" y1="348" x2="618" y2="348" stroke="#444444" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
	<text x="552" y="362" text-anchor="end" font-size="11" fill="#333333">ProgramUploaded,</text>
	<text x="552" y="375" text-anchor="end" font-size="11" fill="#333333">RunRequested</text>

	<rect x="560" y="374" width="128" height="62" rx="4" fill="#fff8e1" stroke="#d8b65a"/>
	<text x="624" y="390" text-anchor="middle" font-size="11">takeUpload()</text>
	<text x="624" y="404" text-anchor="middle" font-size="11">destroy old context</text>
	<text x="624" y="418" text-anchor="middle" font-size="11">wr_newContext()</text>
	<text x="624" y="432" text-anchor="middle" font-size="11">attach(): program 0</text>
	<line x1="445" y1="446" x2="247" y2="446" stroke="#444444" stroke-width="1.4" marker-end="url(#arrow)"/>
	<text x="345" y="440" text-anchor="middle">Loaded event</text>

	<!-- run -->
	<rect x="614" y="458" width="12" height="150" fill="#dfe9d7" stroke="#6e9a59"/>
	<text x="606" y="474" text-anchor="end" font-size="11">wr_resetContext(),</text>
	<text x="606" y="488" text-anchor="end" font-size="11">wr_executeContext()</text>
	<line x1="614" y1="500" x2="447" y2="500" stroke="#444444" stroke-width="1.4" marker-end="url(#arrow)"/>
	<text x="535" y="514" text-anchor="middle" font-size="11" fill="#333333">first line marker</text>
	<line x1="445" y1="530" x2="247" y2="530" stroke="#444444" stroke-width="1.4" marker-end="url(#arrow)"/>
	<text x="345" y="524" text-anchor="middle">Stopped (entry)</text>
	<line x1="245" y1="530" x2="87" y2="530" stroke="#444444" stroke-width="1.4" marker-end="url(#arrow)"/>
	<text x="165" y="524" text-anchor="middle">stopped</text>
	<rect x="455" y="540" width="150" height="34" rx="4" fill="#fff8e1" stroke="#d8b65a"/>
	<text x="530" y="554" text-anchor="middle" font-size="11">halted inside the VM,</text>
	<text x="530" y="568" text-anchor="middle" font-size="11">services the link</text>

	<line x1="85" y1="596" x2="443" y2="596" stroke="#444444" stroke-width="1.4" marker-end="url(#arrow)"/>
	<text x="165" y="590" text-anchor="middle">continue</text>
	<text x="345" y="590" text-anchor="middle">Continue</text>
	<line x1="445" y1="620" x2="87" y2="620" stroke="#444444" stroke-width="1.4" marker-end="url(#arrow)"/>
	<text x="345" y="614" text-anchor="middle">Ended (program 0's run is over)</text>
	<text x="165" y="614" text-anchor="middle">exited</text>
</svg>
